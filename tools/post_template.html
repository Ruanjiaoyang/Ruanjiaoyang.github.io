<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}} | Jiaoyang Ruan</title>
<meta name="description" content="{{desc}}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
  onload="document.querySelectorAll('.post-content, .toc').forEach(function (el) { renderMathInElement(el, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}], throwOnError: false}) })"></script>
<style>
/* Long-form reading layout modelled on Lil'Log (Hugo PaperMod): 720px column, system type, quiet chrome. */
:root {
  --gap: 24px; --content-gap: 20px; --main-width: 720px; --radius: 8px;
  --theme: #ffffff; --entry: #ffffff; --primary: #1e1e1e; --secondary: #6c6c6c; --tertiary: #d6d6d6;
  --content: #1f1f1f; --code-block-bg: #1c1d21; --code-bg: #f5f5f5; --border: #eeeeee; --link: #2743c9;
}
@media (prefers-color-scheme: dark) {
  :root { --theme: #1d1e20; --entry: #2e2e33; --primary: #dadadb; --secondary: #9b9c9d; --tertiary: #414244;
    --content: #c4c4c5; --code-block-bg: #2e2e33; --code-bg: #37383e; --border: #333333; --link: #8fa3ff; color-scheme: dark; }
}
* { box-sizing: border-box; }
html { -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; background: var(--theme); color: var(--primary); font-size: 18px; line-height: 1.6; word-break: break-word;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", Ubuntu, "Helvetica Neue", sans-serif;
}
a { color: inherit; text-decoration: none; }

.nav { display: flex; justify-content: space-between; align-items: center; max-width: calc(var(--main-width) + var(--gap) * 2); margin: 0 auto; line-height: 60px;
  padding-left: max(var(--gap), env(safe-area-inset-left, 0px)); padding-right: max(var(--gap), env(safe-area-inset-right, 0px)); }
.nav .logo { font-size: 24px; font-weight: 700; }
.nav ul { display: flex; gap: 20px; list-style: none; margin: 0; padding: 0; font-size: 16px; }
.nav ul a:hover { color: var(--secondary); }

.main { max-width: calc(var(--main-width) + var(--gap) * 2); margin: 0 auto; min-height: calc(100vh - 120px);
  padding-block: var(--gap); padding-left: max(var(--gap), env(safe-area-inset-left, 0px)); padding-right: max(var(--gap), env(safe-area-inset-right, 0px)); }
.post-header { margin: 24px auto var(--content-gap); }
.post-title { margin-bottom: 2px; font-size: 40px; line-height: 1.25; margin-top: 0; }
.post-meta { color: var(--secondary); font-size: 14px; display: flex; flex-wrap: wrap; align-items: center; }

.toc { margin-bottom: var(--content-gap); border: 1px solid var(--border); background: var(--code-bg); border-radius: var(--radius); padding: 0.4em; font-size: 16px; }
.toc summary { cursor: pointer; margin-inline-start: 20px; padding: 0.4em 0; font-weight: 500; }
.toc .toc { border: 0; padding: 0; background: none; margin: 0; }
.toc ul { list-style-type: none; padding-inline-start: 20px; margin: 0; }
.toc > div, .toc > ul { margin: 0 20px 0.4em; }
.toc li { margin: 4px 0; }
.toc a:hover { box-shadow: 0 1px 0; }

.post-content { color: var(--content); }
.post-content h1, .post-content h2, .post-content h3, .post-content h4 { color: var(--primary); margin: 24px 0 16px; line-height: 1.3; scroll-margin-top: 16px; }
.post-content h2 { font-size: 32px; margin-top: 40px; }
.post-content h3 { font-size: 24px; }
.post-content h4 { font-size: 16px; }
.post-content p { margin: 0 0 var(--content-gap); }
.post-content ul, .post-content ol { padding-inline-start: 20px; margin: 0 0 var(--content-gap); }
.post-content li { margin-top: 5px; }
.post-content li p { margin-bottom: 0; }
.post-content a { color: var(--link); box-shadow: 0 1px 0; }
.post-content strong { color: var(--primary); }
.post-content blockquote { margin: 20px 0; padding: 0 14px; border-inline-start: 3px solid var(--tertiary); color: var(--secondary); }
.post-content hr { margin: 30px 0; height: 2px; background: var(--tertiary); border: 0; }
.post-content code { margin: auto 4px; padding: 4px 6px; font-size: 0.78em; line-height: 1.5; background: var(--code-bg); border-radius: 2px;
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
.post-content pre { margin: 0 0 var(--content-gap); padding: 14px 16px; background: var(--code-block-bg); color: #d5d5d6; border-radius: var(--radius); overflow-x: auto; line-height: 1.5; }
.post-content pre code { margin: 0; padding: 0; background: none; font-size: 14px; color: inherit; }
.post-content table { margin-bottom: var(--content-gap); border-collapse: collapse; width: 100%; display: block; overflow-x: auto; font-size: 16px; }
.post-content th, .post-content td { padding: 8px 10px; text-align: start; border-bottom: 1px solid var(--border); vertical-align: top; }
.post-content th { font-weight: 600; border-bottom-width: 2px; }
.post-content .katex-display { overflow-x: auto; overflow-y: hidden; padding: 2px 0; }
.post-content img { max-width: 100%; margin: 0 auto; display: block; }

.post-footer { margin-top: 48px; padding-top: var(--gap); border-top: 1px solid var(--border); }
.post-footer a { display: inline-block; padding: 8px 16px; border-radius: var(--radius); background: var(--code-bg); font-size: 15px; }
.post-footer a:hover { color: var(--secondary); }
.footer { max-width: calc(var(--main-width) + var(--gap) * 2); margin: 0 auto; padding: calc((var(--gap) + 20px) / 2) var(--gap); text-align: center; color: var(--secondary); font-size: 12px; line-height: 24px; }

@media (max-width: 600px) {
  body { font-size: 17px; }
  .post-title { font-size: 30px; }
  .post-content h2 { font-size: 26px; }
  .post-content h3 { font-size: 21px; }
}
</style>
</head>
<body>
<header>
  <nav class="nav">
    <a class="logo" href="../../../">Jiaoyang Ruan</a>
    <ul><li><a href="../../../#blog">Blog</a></li><li><a href="../../../#publications">Publications</a></li></ul>
  </nav>
</header>
<main class="main">
  <article>
    <header class="post-header">
      <h1 class="post-title">{{title}}</h1>
      <div class="post-meta">{{meta}}</div>
    </header>
    {{toc}}
    <div class="post-content">
{{body}}
    </div>
    <footer class="post-footer"><a href="../../../#blog">← All posts</a></footer>
  </article>
</main>
<footer class="footer">© 2026 Jiaoyang Ruan</footer>
</body>
</html>
