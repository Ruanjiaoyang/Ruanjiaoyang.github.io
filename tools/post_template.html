<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}} · Jiaoyang Ruan</title>
<meta name="description" content="{{desc}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
  onload="document.querySelectorAll('.article, .toc').forEach(function (el) { renderMathInElement(el, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}], throwOnError: false}) })"></script>
<style>
/* Same tokens as the homepage; single reading column for long-form posts. */
:root {
  --bg: #f6f7f9; --surface: #ffffff; --ink: #141b26; --muted: #5a6475; --line: #e1e5ec;
  --accent: #2743c9; --accent-soft: #e8ecfb; --code-bg: #eef1f6;
  --f-display: "Bricolage Grotesque", "Noto Sans SC", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Noto Sans SC", system-ui, -apple-system, "PingFang SC", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0d121b; --surface: #141b27; --ink: #e6eaf2; --muted: #95a0b3; --line: #232c3b;
    --accent: #8fa3ff; --accent-soft: #1b2440; --code-bg: #182030; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.8; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-underline-offset: 3px; }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 48px 96px;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.back { font: 500 0.82rem/1 var(--f-mono); letter-spacing: 0.06em; color: var(--muted); text-decoration: none; }
.back:hover { color: var(--accent); }
header.post-head { margin: 40px 0 32px; display: grid; gap: 10px; }
.kicker { font: 500 0.78rem/1.4 var(--f-mono); letter-spacing: 0.08em; color: var(--accent); margin: 0; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(1.8rem, 4.5vw, 2.5rem); line-height: 1.2; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
.subtitle { color: var(--muted); font-size: 1.05rem; margin: 0; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); font: 0.85rem/1 var(--f-mono); }
.tag { font: 500 0.78rem/1 var(--f-body); padding: 6px 10px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); }
.toc { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 12px 22px; margin-bottom: 36px; font-size: 0.92rem; }
.toc summary { cursor: pointer; font: 500 0.75rem/1.6 var(--f-mono); letter-spacing: 0.12em; color: var(--muted); padding: 4px 0; }
.toc .toc { border: 0; padding: 0; margin: 0; background: none; }
.toc ul { list-style: none; margin: 0; padding-left: 18px; }
.toc > div > ul { padding-left: 0; margin-top: 8px; }
.toc li { margin: 3px 0; }
.toc a { color: var(--ink); text-decoration: none; }
.toc a:hover { color: var(--accent); }
.article h2 { font-family: var(--f-display); font-weight: 500; font-size: 1.55rem; line-height: 1.3; margin: 2.4em 0 0.6em; padding-top: 0.4em; border-top: 1px solid var(--line); scroll-margin-top: 20px; }
.article h3 { font-size: 1.15rem; font-weight: 600; margin: 1.8em 0 0.5em; }
.article p, .article li { color: var(--ink); }
.article strong { font-weight: 600; }
.article blockquote { margin: 1.2em 0; padding: 4px 18px; border-left: 3px solid var(--accent); color: var(--muted); background: var(--surface); }
.article code { font-family: var(--f-mono); font-size: 0.86em; background: var(--code-bg); padding: 2px 5px; border-radius: 4px; }
.article pre { background: var(--code-bg); border-radius: 10px; padding: 16px 18px; overflow-x: auto; line-height: 1.55; }
.article pre code { background: none; padding: 0; font-size: 0.85rem; }
.article table { border-collapse: collapse; width: 100%; font-size: 0.92rem; display: block; overflow-x: auto; }
.article th, .article td { border: 1px solid var(--line); padding: 8px 12px; text-align: left; vertical-align: top; }
.article th { background: var(--surface); font-weight: 600; }
.article .katex-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
.article img { max-width: 100%; height: auto; }
.article figure { margin: 1.8em 0; text-align: center; }
.article figure img { background: #fff; border-radius: 8px; padding: 12px; }
.article figcaption { margin-top: 10px; color: var(--muted); font-size: 0.85rem; line-height: 1.6; text-align: center; }
footer { margin-top: 64px; padding-top: 24px; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.85rem; }
@media (max-width: 600px) { body { font-size: 16px; } }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../../../#blog">← Jiaoyang Ruan · Blog</a>
  <header class="post-head">
    <p class="kicker">{{kicker}}</p>
    <h1>{{title}}</h1>
    <p class="subtitle">{{title_en}}</p>
    <div class="meta"><span>{{date}}</span>{{tags}}</div>
  </header>
  {{toc}}
  <article class="article">
{{body}}
  </article>
  <footer><a href="../../../#blog">← 返回博客列表</a></footer>
</div>
</body>
</html>
